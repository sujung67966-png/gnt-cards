name: 인스타 카드뉴스

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '할 일 (확인 = 게시 안 하고 토큰만 확인)'
        type: choice
        options: ['확인', '올리기']
        default: '확인'
      folder:
        description: '올릴 폴더 이름 (cards/ 아래, 예: 002_usim_only). 확인일 땐 비워 둠'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 실행
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          PYTHONIOENCODING: utf-8
          TZ: Asia/Seoul
        run: python 올리기/인스타_올리기.py "${{ inputs.mode }}" "${{ inputs.folder }}"
      - name: 올린 기록 저장
        if: inputs.mode == '올리기'
        run: |
          git config user.name "gnt-cards-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cards/*/올림.txt
          git commit -m "인스타 올림 기록: ${{ inputs.folder }}" || true
          git push
